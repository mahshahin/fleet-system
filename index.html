<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EGYPTAIR-NEW FLEET</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
    /* يمكنك إزالة كلاس .bg-login بالكامل لأنه لم يعد مستخدماً */
</style>
</head>
<body class="min-h-screen bg-gray-100 relative flex items-center justify-center p-4 sm:p-6 font-sans selection:bg-purple-500 selection:text-white overflow-hidden">

    <div class="relative z-10 w-full max-w-md sm:max-w-[400px] p-6 sm:p-10 rounded-2xl sm:rounded-3xl bg-white border border-gray-200 shadow-xl text-gray-800 text-center transition-all duration-300 mx-auto">
        
        <div class="mb-6 sm:mb-8 text-center">
            <h2 class="text-lg sm:text-xl font-black tracking-widest text-gray-900 uppercase mb-1">
                EGYPTAIR NEW A/C FLEET
            </h2>
            <p class="text-xs sm:text-sm text-gray-500 font-bold tracking-widest uppercase">
                Secure Login
            </p>
        </div>

        <form id="loginForm" class="flex flex-col gap-5 sm:gap-6 text-left" dir="ltr">
            <div class="relative">
                <input type="text" id="username" placeholder="Username" required class="w-full bg-gray-50 border border-gray-300 rounded-full px-5 sm:px-6 py-3 sm:py-3.5 text-gray-900 placeholder-gray-400 focus:outline-none focus:bg-white focus:border-purple-500 focus:ring-2 focus:ring-purple-200 transition-all pr-12 text-base sm:text-sm" />
                <div class="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fillRule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clipRule="evenodd" />
                    </svg>
                </div>
            </div>

            <div class="relative">
                <input type="password" id="password" placeholder="Password" required class="w-full bg-gray-50 border border-gray-300 rounded-full px-5 sm:px-6 py-3 sm:py-3.5 text-gray-900 placeholder-gray-400 focus:outline-none focus:bg-white focus:border-purple-500 focus:ring-2 focus:ring-purple-200 transition-all pr-12 text-base sm:text-sm" />
                <div class="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fillRule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clipRule="evenodd" />
                    </svg>
                </div>
            </div>

            <div class="flex items-center gap-2 px-2 -mt-1 sm:-mt-2 justify-start">
                <input type="checkbox" id="showPassword" class="w-4 h-4 accent-purple-600 cursor-pointer rounded border-gray-300" />
                <label for="showPassword" class="text-xs sm:text-sm text-gray-600 cursor-pointer select-none">Show Password</label>
            </div>

            <div class="flex items-center gap-2 px-2 justify-start mb-2">
                <input type="checkbox" id="remember" class="w-4 h-4 accent-purple-600 cursor-pointer rounded border-gray-300" />
                <label for="remember" class="text-xs sm:text-sm text-gray-600 cursor-pointer select-none">Remember me</label>
            </div>

            <button type="submit" class="w-full bg-slate-900 text-white font-bold rounded-full py-3 sm:py-3.5 mt-2 hover:bg-slate-800 active:scale-[0.98] transition-all shadow-lg cursor-pointer text-sm sm:text-base">
                Login
            </button>
        </form>
    </div>

    <div id="error-toast" class="fixed top-5 left-1/2 transform -translate-x-1/2 z-50 bg-red-600/90 backdrop-blur-md text-white px-6 py-3 rounded-full shadow-2xl flex items-center gap-3 transition-all duration-500 opacity-0 -translate-y-10 pointer-events-none w-11/12 max-w-md text-sm sm:text-base font-bold" dir="rtl">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
        <span id="error-message">بيانات الدخول غير صحيحة، راجع الكود والباسورد!</span>
    </div>

    <script>
        // دالة سحرية لإظهار رسالة الخطأ الشيك
function showErrorToast(message) {
    const toast = document.getElementById('error-toast');
    const msgElement = document.getElementById('error-message');
    
    // تغيير النص لو حابب
    if(message) msgElement.innerText = message;

    // إظهار الإشعار (تغيير الكلاسات لعمل أنيميشن النزول)
    toast.classList.remove('opacity-0', '-translate-y-10');
    toast.classList.add('opacity-100', 'translate-y-0');

    // إخفاء الإشعار أوتوماتيك بعد 3 ثواني
    setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', '-translate-y-10');
    }, 3000);
}

// 👁️ ذكاء إظهار وإخفاء الباسورد
document.getElementById('showPassword').addEventListener('change', function() {
    const passInput = document.getElementById('password');
    // لو متعلم عليها، حول الحقل لنص مقروء، ولو لأ رجعه باسورد مخفي
    passInput.type = this.checked ? 'text' : 'password';
});

// 🧠 سيستم "تذكرني": استرجاع البيانات عند فتح الصفحة
window.addEventListener('DOMContentLoaded', (event) => {
    if (localStorage.getItem('fleetUsername')) {
        document.getElementById('username').value = localStorage.getItem('fleetUsername');
        document.getElementById('password').value = localStorage.getItem('fleetPassword');
        document.getElementById('remember').checked = true;
    }
});


// كود إرسال البيانات (زي ما هو بس غيرنا طريقة عرض الخطأ)
document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault(); 
    
    const submitBtn = e.target.querySelector('button[type="submit"]');
    const originalText = submitBtn.innerText;
    submitBtn.innerText = 'Authenticating... ✈️';
    submitBtn.disabled = true;

    const usernameVal = document.getElementById('username').value;
    const passwordVal = document.getElementById('password').value;

    // تأكد إن الرابط السري بتاعك محطوط هنا صح
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyUTEVCT6z11BBEPzAxi_y9cQ6va87KJJZs5C1NlJi_F8w4Pe_P9l6lyy7XAR6Wd0Kp/exec';

    fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ username: usernameVal, password: passwordVal })
    })
    .then(response => response.json())
    .then(data => {
        if (data.status === 'success') {
            // 💾 هنا تكة الـ QA: لو معلم على تذكرني، احفظ البيانات في المتصفح
        if (document.getElementById('remember').checked) {
            localStorage.setItem('fleetUsername', usernameVal);
            localStorage.setItem('fleetPassword', passwordVal);
        } else {
            // لو مش معلم، امسح البيانات من المتصفح عشان الأمان
            localStorage.removeItem('fleetUsername');
            localStorage.removeItem('fleetPassword');
        }
            window.location.href = 'dashboard.html'; 
        } else {
            // هنا استخدمنا الإشعار الشيك بدل الـ alert
            showErrorToast('بيانات الدخول غير صحيحة، يرجى المحاولة مرة أخرى.');
            submitBtn.innerText = originalText;
            submitBtn.disabled = false;
        }
    })
    .catch(error => {
        // وهنا كمان في حالة خطأ في النت
        showErrorToast('حدث خطأ في الاتصال، تأكد من الإنترنت الخاص بك.');
        submitBtn.innerText = originalText;
        submitBtn.disabled = false;
    });
});
    </script>
</body>
</html>
